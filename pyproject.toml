[project]
name = "simtradelab"
version = "2.13.9"
description = "Lightweight quantitative backtesting framework with PTrade API simulation | 轻量级量化回测框架"
authors = [{ name = "kay", email = "kayou@duck.com" }]
license = "AGPL-3.0-or-later"
license-files = [
    "LICENSE",
    "licenses/LICENSE.zh-CN",
    "licenses/LICENSE-COMMERCIAL.md",
    "licenses/LICENSE-COMMERCIAL.zh-CN.md",
]
readme = "README.md"
requires-python = ">=3.9,<4.0"
keywords = ["quantitative", "backtest", "trading", "strategy", "ptrade", "finance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=1.5.0",
    # pyarrow 26 起运行时强制 numpy>=2，而它的元数据不再声明 numpy 依赖，
    # pip 会解析出与 numpy<2 冲突的组合并在 import 时炸掉全部 parquet 读取
    "pyarrow>=10.0.0,<26",
    "numpy>=1.20.0,<2.0",
    "cachetools>=5.0.0,<6.0.0",
    "joblib>=1.0.0,<2.0.0",
    "matplotlib>=3.5.0,<4.0.0",
    "tqdm>=4.0.0,<5.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
indicators = ["ta-lib"]
optimizer = ["optuna>=3.0.0,<4.0.0"]
all = ["ta-lib", "optuna>=3.0.0,<4.0.0"]

[project.scripts]
simtradelab = "simtradelab.cli:main"

[project.urls]
Homepage = "https://github.com/kay-ou/SimTradeLab"
Repository = "https://github.com/kay-ou/SimTradeLab"
Documentation = "https://github.com/kay-ou/SimTradeLab/tree/main/docs"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.15.8,<0.16.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"



[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line-too-long (formatter handles)
    "B008",    # function-call-in-default-argument (FastAPI Depends)
    "UP007",   # Use X | Y (keep Optional for py310 compat)
    "UP045",   # Use X | None (same reason as UP007)
    "UP032",   # Use f-string (ptrade platform does not support f-string)
    "UP031",   # Use f-string (same)
    "RUF001",  # Ambiguous unicode in string (Chinese content)
    "RUF002",  # Ambiguous unicode in docstring (Chinese content)
    "RUF003",  # Ambiguous unicode in comment (Chinese content)
]

[tool.ruff.lint.isort]
known-first-party = ["simtradelab"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
