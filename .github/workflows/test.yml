name: Test SimTradeLab

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'licenses/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'licenses/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The explicit sync installs --all-extras; keep uv run from re-syncing
      # without those extras.
      UV_NO_SYNC: "1"
      UV_LOCKED: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib && ./configure --prefix=/usr && make && sudo make install
          cd .. && rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Run basic import test
        run: |
          uv run python -c "import simtradelab; print('SimTradeLab ' + simtradelab.__version__ + ' imported successfully')"

      - name: Run critical Ruff checks
        run: uv run ruff check src tests --select E9,F63,F7,F82

      - name: Check Ruff baseline
        run: uv run python script/check_ruff_baseline.py

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v --tb=short

      - name: Test package build and install
        run: |
          uv build
          python -m venv test_env
          source test_env/bin/activate
          WHEEL_FILE=$(find dist -name "simtradelab-*.whl" | head -1)
          pip install "$WHEEL_FILE"
          python -c "import simtradelab; print('Package install test passed: ' + simtradelab.__version__)"
          simtradelab --help

      - name: Generate coverage report
        if: matrix.python-version == '3.11'
        run: uv run pytest tests/ --cov=simtradelab --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
